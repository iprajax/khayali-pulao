name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK 36 (runner image already has the SDK)
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (maths, parser, on-device-only guards)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Website calculator matches the app's maths
        run: node docs/khayali.test.mjs

      - name: Build debug + release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify the APK requests zero permissions
        run: |
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          PERMS="$("$AAPT" dump permissions app/build/outputs/apk/release/app-release-unsigned.apk | grep -c 'uses-permission' || true)"
          echo "permissions requested: $PERMS"
          test "$PERMS" = "0"

      - uses: actions/upload-artifact@v4
        with:
          name: khayali-pulao-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
